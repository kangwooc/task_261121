server:
  port: 8080
spring:
  application:
    name: member-service
  datasource:
    url: jdbc:postgresql://localhost:15432/member
    username: member
    password: member
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  threads:
    virtual:
      enabled: true
  http:
    clients:
      imperative:
        factory: jdk
    serviceclient:
      group:
        base-url: http://127.0.0.1:8081
        connect-timeout: 500ms
        read-timeout: 1s
app:
  time-zone: Asia/Seoul
