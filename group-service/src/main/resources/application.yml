server:
  port: 8081
  address: 127.0.0.1
spring:
  application:
    name: group-service
  datasource:
    url: jdbc:postgresql://localhost:15433/group
    username: group
    password: group
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  threads:
    virtual:
      enabled: true
app:
  time-zone: Asia/Seoul
management:
  server:
    port: 9081
    address: 127.0.0.1
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  tracing:
    sampling:
      probability: 1.0
  metrics:
    distribution:
      percentiles-histogram:
        http.client.requests: true
logging:
  pattern:
    correlation: "[%X{traceId:-},%X{spanId:-}] "
