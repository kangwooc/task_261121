server:
  port: 8081
  address: 127.0.0.1
spring:
  application:
    name: group-service
  datasource:
    url: jdbc:postgresql://localhost:15433/group
    username: group
    password: group
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration,classpath:db/seed
  threads:
    virtual:
      enabled: true
app:
  time-zone: Asia/Seoul
